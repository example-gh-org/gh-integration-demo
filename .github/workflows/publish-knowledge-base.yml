name: Publish knowledge base

# Runs whenever a change to the knowledge base lands on main, which is what a
# merged pull request produces. Can also be triggered manually.
on:
  push:
    branches: [main]
    paths:
      - "knowledge-base/**"
      - "scripts/**"
      - ".github/workflows/publish-knowledge-base.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let in-flight deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pandoc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pandoc

      - name: Build HTML from markdown
        run: scripts/build-site.sh knowledge-base _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
